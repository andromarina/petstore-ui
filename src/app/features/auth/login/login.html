<div class="login-page">
  <div class="login-card">
    <h1>Sign in</h1>
    <p class="login-subtitle">Use your Pet Store account</p>

    @if (loginError) {
      <p class="login-error" role="alert">{{ loginError }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>Username</span>
        <input type="text" formControlName="username" autocomplete="username" />
        @if (form.controls.username.touched && form.controls.username.invalid) {
          <span class="field-error">Username is required</span>
        }
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" />
        @if (form.controls.password.touched && form.controls.password.hasError('required')) {
          <span class="field-error">Password is required</span>
        }
        @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
          <span class="field-error">Password must be at least 6 characters</span>
        }
      </label>

      <button type="submit" [disabled]="submitting">
        {{ submitting ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="login-hint">Demo admin: <strong>admin</strong> / <strong>admin123</strong></p>
  </div>
</div>
